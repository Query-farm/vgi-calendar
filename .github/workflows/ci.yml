#
# Unit tests (pytest), lint, and the sqllogictest extension suite
# (test/sql/*.test) run against the vgi-calendar worker through the real signed
# `vgi` DuckDB community extension via a prebuilt standalone `haybarn-unittest`.
# See ci/README.md for the design.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['README.md']
  pull_request:
    branches: [main]
    paths-ignore: ['README.md']
  workflow_dispatch:
  # Allow the docker-publish + release workflows to gate on this CI.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.14"]

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run tests
        run: uv run pytest -q

  lint:
    name: Lint
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.14"
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Check linting
        run: uv run ruff check .

      - name: Type check (mypy)
        run: uv run mypy vgi_calendar/ calendar_worker.py

      # Run pydoclint in an isolated tool env (uvx): it needs
      # `docstring-parser-fork`, but vgi-rpc pulls in plain `docstring-parser`,
      # and the two share the `docstring_parser` import namespace -- installed
      # together their file order is nondeterministic and can break the import.
      - name: Docstring lint (pydoclint)
        run: uvx pydoclint --config pyproject.toml vgi_calendar/ calendar_worker.py

  # Metadata-quality gate: build the worker into a project venv, then run the
  # vgi-lint catalog linter against that venv's python LOCATION and fail on any
  # finding (info and up). Kept a separate job so the lint score is visible.
  # NB: lint against `.venv/bin/python calendar_worker.py`, NOT `uv run
  # calendar_worker.py` — the PEP-723 script env `uv run` builds is resolved and
  # cached independently of the locked venv and can serve a stale SDK that emits
  # the old catalog schema, producing a false schema-mismatch. The venv python
  # runs the exact locked vgi-python the rest of CI installs.
  metadata-quality:
    name: Metadata quality (vgi-lint)
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.14"
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Install the worker (with the http extra)
        run: uv sync --frozen --python 3.14 --extra http

      - name: vgi-lint
        uses: Query-farm/vgi-lint-check@v2
        with:
          location: "${{ github.workspace }}/.venv/bin/python ${{ github.workspace }}/calendar_worker.py"
          fail-on: info

  # SQL tests: test/sql/*.test through the published haybarn-unittest with the
  # signed community `vgi` extension, over every transport (ci/run-integration.sh,
  # adapted from the vgi-starters template). `launch` starts the worker once on a
  # unix socket and pools connections.
  integration:
    name: SQL tests (${{ matrix.os }}, ${{ matrix.transport }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        transport: [stdio, launch, http]
    env:
      UV_PYTHON: "3.14"
      HAYBARN_VERSION: "2.0.0rc11"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Build the worker
        run: uv sync --locked --all-extras

      - name: Install the SQL test runner
        run: |
          uv venv .tools
          uv pip install -p .tools "haybarn-unittest==${HAYBARN_VERSION}"

      - name: Run test/sql over ${{ matrix.transport }}
        run: |
          export WORKER="$PWD/.venv/bin/vgi-calendar-worker"
          export HAYBARN_UNITTEST="$PWD/.tools/bin/haybarn-unittest"
          TRANSPORT=${{ matrix.transport }} PYTHON="uv run --no-project python" ci/run-integration.sh
